name: Release
on:
  push:
    tags:
      - 'v*'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.2'
      - run: bundle install
      - name: Verify tag and version
        run: test "${GITHUB_REF_NAME}" = "v$(bundle exec ruby -Ilib -rdenebola/version -e 'print Denebola::VERSION')"
      - name: Test and build
        run: |
          bundle exec rake
          gem build --strict denebola.gemspec --output /tmp/denebola.gem
      - name: Publish through RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
