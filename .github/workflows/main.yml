name: Ruby
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    env:
      BUNDLE_VERSION: system
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
      - name: Verify isolation and dependency-free runtime
        run: ruby tools/check_isolation.rb
      - name: Build with strict gem validation
        run: gem build --strict denebola.gemspec

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake bench:assert
